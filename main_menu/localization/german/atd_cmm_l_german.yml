l_german:
 # Mod
 atd_name: "Autonome Diplomaten"
 atd_desc: "Automatisiert Eure diplomatischen Aktionen."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "Minimale Diplomatenreserve"
 atd__min_diplomats_desc: "Mindestanzahl an angesparten Diplomaten, die in Reserve gehalten werden sollen. Wird mit dem Schieberegler für „Minimale monatliche Diplomaten“ auf der Automatisierungskarte für diplomatische Interaktionen geteilt."
 atd__min_diplomat_gain_name: "Minimaler Diplomatenzuwachs"
 atd__min_diplomat_gain_desc: "Das Verbessern von Beziehungen wird pausiert, solange Euer monatlicher Diplomatenzuwachs unter diesem Wert liegt. Dies gilt nicht für das Erzwingen bei Untertanen oder automatisches Schenken."
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "Kategorie"

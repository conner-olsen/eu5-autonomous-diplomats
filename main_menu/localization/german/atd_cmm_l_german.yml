 atd__settings: "atd__settings"
 atd__settings__reserve: "atd__settings__reserve"
 atd__improve_relations__automation_name: "Automatisierung"
 atd__improve_relations_enabled_name: "Beziehungen verbessern"
 atd__improve_relations_enabled_desc: "Entsendet Diplomaten, um die Beziehungen zu Ländern in den unten stehenden Kategorien zu verbessern."
 atd__settings__automation_name: "Automatisierung"
 atd__enabled_name: "Aktiviert"
 atd__enabled_desc: "Aktiviert autonome Diplomaten. Schaltet zudem die Automatisierung der Diplomatie-Interaktionen des Spiels um."
 atd__min_diplomats_format: "[CMMV('atd__min_diplomats')|1]"
 atd_automation_open_settings: "Autonome Diplomaten öffnen"
 atd_automation_improve_opinion_tooltip: "Entsendet Diplomaten, um die Beziehungen zu Ländern in den konfigurierten Kategorien zu verbessern. Konfiguriert Kategorien und Prioritäten in den Einstellungen für autonome Diplomaten."
 atd_automation_diplomat_reserve_tooltip: "Die Automatisierung sendet [diplomats|e] nur dann, wenn die aktuell angesparte Menge diese Reserve überschreitet, sodass der Rest für Eure manuelle Verwendung verfügbar bleibt. Diese Reserve gilt auch für Autonome Diplomaten und kann ebenfalls in deren Einstellungen geändert werden."
 atd__enabled: "atd__enabled"
 atd__improve_relations_enabled: "atd__improve_relations_enabled"
 atd__improve_relations__automation: "atd__improve_relations__automation"
 atd__settings__automation: "atd__settings__automation"
 atd__improve_relations_i8_name: "Bedrohliche Länder"
 atd__improve_relations_i8_desc: "Verbessert die Beziehungen zu Ländern, die Euch bedrohen, beginnend mit den größten Bedrohungen."
 atd__improve_relations_i9_name: "Marktbesitzer"
 atd__improve_relations_i9_desc: "Verbessere die Beziehungen zu Ländern, die einen Markt besitzen."
 atd__improve_relations_i10_name: "Königreiche und Kaiserreiche"
 atd__improve_relations_i10_desc: "Verbessert die Beziehungen zu Königreichen und Kaiserreichen."
 atd__improve_relations_i11_name: "Größte Nationen"
 atd__improve_relations_i11_desc: "Verbessert die Beziehungen zu den größten Nationen innerhalb Eurer diplomatischen Reichweite, die Ihr entdeckt habt, beginnend mit der größten."
 atd__improve_relations__limits_name: "Limits"
 atd__max_relations_name: "Maximale Beziehungen"
 atd__max_relations_desc: "Beendet die Verbesserung der Beziehungen zu Ländern, sobald deren Meinung über Euch diesen Wert erreicht, und bricht laufende Verbesserungen ab. Bei 200+ gibt es kein Limit."
 atd__max_relations_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_relations'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_relations'))))]"
 atd__max_antagonism_name: "Maximaler Antagonismus"
 atd__max_antagonism_desc: "Verbessert keine Beziehungen zu Ländern, deren Antagonismus gegenüber Euch diesen Wert übersteigt. Ab 200+ gibt es keine Beschränkung."
 atd__max_antagonism_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_antagonism'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_antagonism'))))]"
 atd_block_autonomous_improving: "#B #!Autonome Verbesserung blockieren"
 atd_block_autonomous_improving_desc: "Beziehungen zu [SCOPE.sCountry('recipient').GetName] nicht mehr automatisch verbessern. Bereits laufende Verbesserungen werden von selbst abgeschlossen."
 atd_allow_autonomous_improving: "#B #!Autonomes Verbessern zulassen"
 atd_allow_autonomous_improving_desc: "Automatisches Verbessern der Beziehungen mit [SCOPE.sCountry('recipient').GetName] fortsetzen."

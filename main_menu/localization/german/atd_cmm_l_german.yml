 atd__improve_relations_name: "Beziehungen verbessern"
 atd__improve_relations__improve_relations_name: "Beziehungen verbessern"
 atd__improve_relations__improve_relations_desc: "Entsendet automatisch Diplomaten, um die Beziehungen zu Ländern in jeder Kategorie zu verbessern. Höher in der Liste stehende Kategorien werden vorrangig behandelt."
 atd__improve_relations_i1_desc: "Beziehungen zu Ländern verbessern, die an Euch angrenzen."
 atd__improve_relations_i2_desc: "Beziehungen zu Euren Untertanen verbessern."
 atd__improve_relations_i3_desc: "Verbessert die Beziehungen zu Ländern, die eine negative Meinung von uns haben, wobei die am stärksten empörten zuerst priorisiert werden."
 atd__improve_relations_i4_desc: "Verbessert die Beziehungen zu Euren Verbündeten und Mitgliedern der Verteidigungsliga."
 atd__improve_relations_i5_desc: "Verbessert die Beziehungen zu Ländern, die Euch bedrohen, wobei die größten Bedrohungen zuerst berücksichtigt werden."
 atd__improve_relations_i6_name: "HRR-Kurfürsten"
 atd__improve_relations_i6_desc: "Beziehungen zu den Kurfürsten des Heiligen Römischen Reiches verbessern."
 atd__improve_relations_i7_name: "HRR-Mitglieder"
 atd__improve_relations_i7_desc: "Beziehungen zu Mitgliedern des Heiligen Römischen Reiches verbessern."

l_german:
 # Mod
 atd_name: "Autonome Diplomaten"
 atd_desc: "Automatisiert Eure diplomatischen Aktionen."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "Minimale Diplomatenreserve"
 atd__min_diplomats_desc: "Mindestanzahl an angesparten Diplomaten, die in Reserve gehalten werden sollen. Autonome Aktionen verwenden keine Diplomaten unterhalb dieses Schwellenwerts. Wird mit dem Schieberegler für „Minimale monatliche Diplomaten“ auf der Automatisierungskarte für diplomatische Interaktionen geteilt."
 atd__min_diplomat_gain_name: "Minimaler Diplomatenzuwachs"
 atd__min_diplomat_gain_desc: "Minimaler monatlicher Diplomatenzuwachs. Autonome Aktionen werden keine Diplomaten mehr entsenden, wenn Ihr monatlicher Zuwachs diesen Wert unterschreitet."
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "Kategorie"
 atd__improve_relations_i1_name: "Anführer der Reichskreise des HRR"
 atd__improve_relations_i2_name: "HRR-Kurfürsten"
 atd__improve_relations_i3_name: "HRR-Mitglieder"
 atd__improve_relations_i4_name: "Nachbarländer"
 atd__improve_relations_i5_name: "Eigene Untertanenstaaten"
 atd__improve_relations__count_name: "Diplomaten"

 # Optional: self-referencing flag keys to suppress IDE warnings (safe to remove if you want)
 atd: "atd"
 atd__min_diplomats: "atd__min_diplomats"
 atd__min_diplomat_gain: "atd__min_diplomat_gain"
 atd__improve_relations: "atd__improve_relations"
 atd__improve_relations__count: "atd__improve_relations__count"
 atd__improve_relations_name: "Beziehungen verbessern"
 atd__improve_relations__improve_relations_name: "Beziehungen verbessern"
 atd__improve_relations__improve_relations_desc: "Entsendet automatisch Diplomaten, um die Beziehungen zu Ländern in jeder Kategorie zu verbessern. Höher in der Liste stehende Kategorien werden vorrangig behandelt."
 atd__improve_relations_i1_desc: "Verbessert die Beziehungen zu den Anführern der Reichskreise im Heiligen Römischen Reich."
 atd__improve_relations_i2_desc: "Beziehungen zu den Kurfürsten des Heiligen Römischen Reichs verbessern."
 atd__improve_relations_i3_desc: "Beziehungen zu den Mitgliedern des Heiligen Römischen Reiches verbessern."
 atd__improve_relations_i4_desc: "Verbessert die Beziehungen zu Ländern, die an Euch angrenzen."
 atd__improve_relations_i5_desc: "Verbessert die Beziehungen zu Euren Untertanen."
 atd__improve_relations_i6_name: "Empörte Länder"
 atd__improve_relations_i6_desc: "Verbessert die Beziehungen zu Ländern, die einen Antagonismus von mindestens 10 gegen uns haben, wobei die am stärksten erzürnten zuerst berücksichtigt werden. Bricht die Verbesserung ab, sobald ihr Antagonismus unter 5 sinkt."
 atd__improve_relations_i7_name: "Verbündete"
 atd__improve_relations_i7_desc: "Verbessere die Beziehungen zu deinen Verbündeten und den Mitgliedern des Verteidigungsbündnisses."
 atd__subjects_name: "Untertanen"
 atd__subjects__enforce_name: "Erzwingen"
 atd__enforce_item_column_name: "Aktion"
 atd__enforce_i1_name: "Religion erzwingen"
 atd__enforce_i2_name: "Kultur durchsetzen"
 atd__enforce__enabled_name: "Aktiviert"
 atd__settings_name: "Einstellungen"
 atd__settings__reserve_name: "Reserve"
 atd__settings__reserve_desc: "Einstellungen für die Diplomatenreserve."
 atd__improve_relations__improve_relations: "atd__improve_relations__improve_relations"
 atd__subjects: "atd__subjects"
 atd__subjects__enforce: "atd__subjects__enforce"
 atd__enforce: "atd__enforce"

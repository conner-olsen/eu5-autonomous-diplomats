 atd_log_opinion_195_to_199: "ATD: opinion 195-199"
 atd_log_opinion_190_to_194: "ATD: opinion 190-194"
 atd_log_opinion_185_to_189: "ATD: opinion 185-189"
 atd_log_opinion_180_to_184: "ATD: opinion 180-184"
 atd_log_opinion_150_to_180: "ATD: opinion 150-179"
 atd_log_setting_flag: "ATD: setting atd_pending_cancel"
 atd_log_clearing_flag: "ATD: clearing atd_pending_cancel"
 atd_log_cancel_fired: "ATD: OnRightClick fired (auto-cancel ran)"

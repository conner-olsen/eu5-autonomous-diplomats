l_english:
 # Mod
 atd_name: "Autonomous Diplomats"
 atd_desc: "Automate your diplomatic actions."

 # Improve Relations (improve_relations) Tab
 atd__improve_relations_name: "Improve Relations"
 ## Automation (automation) Group
 atd__improve_relations__automation_name: "Automation"
 atd__improve_relations_enabled_name: "Improve Relations"
 atd__improve_relations_enabled_desc: "Send diplomats to improve relations with countries in the categories below."
 atd__improve_relations__improve_relations_name: "Improve Relations"
 atd__improve_relations__improve_relations_desc: "Automatically send diplomats to improve relations with countries in each category. Categories higher in the list are prioritized first."
 atd__improve_relations_item_column_name: "Category"
 atd__improve_relations_i1_name: "Neighboring Countries"
 atd__improve_relations_i1_desc: "Improve relations with countries that border you."
 atd__improve_relations_i2_name: "Own Subject Countries"
 atd__improve_relations_i2_desc: "Improve relations with your subject countries."
 atd__improve_relations_i3_name: "Outraged Countries"
 atd__improve_relations_i3_desc: "Improve relations with countries that have a negative opinion of you, targeting the most outraged first."
 atd__improve_relations_i4_name: "Allies"
 atd__improve_relations_i4_desc: "Improve relations with your allies and defensive league members."
 atd__improve_relations_i5_name: "Threatening Countries"
 atd__improve_relations_i5_desc: "Improve relations with countries that threaten you, targeting the greatest threats first."
 atd__improve_relations_i6_name: "HRE Electors"
 atd__improve_relations_i6_desc: "Improve relations with Holy Roman Empire electors."
 atd__improve_relations_i7_name: "HRE Members"
 atd__improve_relations_i7_desc: "Improve relations with Holy Roman Empire members."
 atd__improve_relations__count_name: "Diplomats"

 # Subjects (subjects) Tab
 atd__subjects_name: "Subjects"
 atd__subjects__enforce_name: "Enforce"
 atd__enforce_item_column_name: "Action"
 atd__enforce_i1_name: "Enforce Religion"
 atd__enforce_i2_name: "Enforce Culture"
 atd__enforce__enabled_name: "Enabled"

 # Settings (settings) Tab
 atd__settings_name: "Settings"
 ## Automation (automation) Group
 atd__settings__automation_name: "Automation"
 atd__enabled_name: "Enabled"
 atd__enabled_desc: "Enable Autonomous Diplomats. Also toggles the game's Diplomacy Interactions automation."
 ## Reserve (reserve) Group
 atd__settings__reserve_name: "Reserve"
 atd__settings__reserve_desc: "Diplomat reserve settings."
 atd__min_diplomats_name: "Minimum Diplomats Reserve"
 atd__min_diplomats_desc: "Minimum number of banked diplomats to keep in reserve. Autonomous actions will not use diplomats below this threshold. Shared with the Minimum Monthly Diplomats slider on the Diplomacy Interactions automation card."
 atd__min_diplomats_format: "[CMMV('atd__min_diplomats')|1]"
 atd__min_diplomat_gain_name: "Minimum Diplomat Gain"
 atd__min_diplomat_gain_desc: "Minimum monthly diplomat gain to maintain. Autonomous actions will stop sending diplomats if your monthly gain would drop below this value."

 # Automation Panel
 atd_automation_open_settings: "Open Autonomous Diplomats"
 atd_automation_improve_opinion_tooltip: "Send diplomats to improve relations with countries in the configured categories. Configure categories and priorities in the Autonomous Diplomats settings."
 atd_automation_diplomat_reserve_tooltip: "Automation will only send [diplomats|e] when the current banked amount exceeds this reserve, leaving the remainder available for your manual use. This reserve also applies to Autonomous Diplomats and can be changed from its settings as well."

 # Optional: self-referencing flag keys to suppress IDE warnings (safe to remove if you want)
 atd: "atd"
 atd__enabled: "atd__enabled"
 atd__improve_relations_enabled: "atd__improve_relations_enabled"

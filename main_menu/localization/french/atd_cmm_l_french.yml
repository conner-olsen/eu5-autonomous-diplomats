 atd_automation_open_settings: "Ouvrir les diplomates autonomes"
 atd_automation_improve_opinion_tooltip: "Envoyez des diplomates pour améliorer les relations avec les pays des catégories configurées. Configurez les catégories et les priorités dans les paramètres des diplomates autonomes."
 atd_automation_diplomat_reserve_tooltip: "L'automatisation n'enverra [diplomats|e] que lorsque le montant actuellement accumulé dépasse cette réserve, laissant le reste disponible pour votre usage manuel. Cette réserve s'applique également aux diplomates autonomes."
 atd__enabled: "atd__enabled"
 atd__improve_relations_enabled: "atd__improve_relations_enabled"
 atd__improve_relations__automation: "atd__improve_relations__automation"
 atd__settings__automation: "atd__settings__automation"
 atd__improve_relations_i8_name: "Pays menaçants"
 atd__improve_relations_i8_desc: "Améliorez les relations avec les pays qui vous menacent, en ciblant d'abord les menaces les plus importantes."
 atd__improve_relations_i9_name: "Propriétaires des marchés"
 atd__improve_relations_i9_desc: "Améliorer les relations avec les pays possédant un marché."
 atd__improve_relations_i10_name: "Royaumes et empires"
 atd__improve_relations_i10_desc: "Améliorer les relations avec les royaumes et les empires."
 atd__improve_relations_i11_name: "Plus grandes nations"
 atd__improve_relations_i11_desc: "Améliorez les relations avec les plus grandes nations à votre portée diplomatique que vous avez découvertes, en commençant par les plus puissantes."
 atd__improve_relations__limits_name: "Limites"
 atd__max_relations_name: "Relations maximales"
 atd__max_relations_desc: "Cesse d'améliorer les relations avec les pays une fois que leur opinion de vous atteint cette valeur, annulant toute amélioration en cours. À 200+, il n'y a pas de limite."
 atd__max_relations_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_relations'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_relations'))))]"
 atd__max_antagonism_name: "Antagonisme maximum"
 atd__max_antagonism_desc: "Ne pas améliorer les relations avec les pays dont l'antagonisme envers vous est supérieur à cette valeur. À 200+, il n'y a pas de limite."
 atd__max_antagonism_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_antagonism'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_antagonism'))))]"

 atd_automation_open_settings: "Ouvrir les diplomates autonomes"
 atd_automation_improve_opinion_tooltip: "Envoyez des diplomates pour améliorer les relations avec les pays des catégories configurées. Configurez les catégories et les priorités dans les paramètres des diplomates autonomes."
 atd_automation_diplomat_reserve_tooltip: "L'automatisation n'enverra [diplomats|e] que lorsque le montant actuellement en réserve dépasse ce seuil, laissant le reste disponible pour votre utilisation manuelle. Cette réserve s'applique également aux diplomates autonomes et peut également être modifiée dans ses paramètres."

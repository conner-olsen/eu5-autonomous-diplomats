l_french:
 # Mod
 atd_name: "Diplomates autonomes"
 atd_desc: "Automatisez vos actions diplomatiques."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "Réserve minimale de diplomates"
 atd__min_diplomats_desc: "Nombre minimum de diplomates en réserve à conserver. Partagé avec le curseur du Minimum de diplomates mensuels sur la carte d'automatisation des interactions diplomatiques."
 atd__min_diplomat_gain_name: "Gain minimum de diplomates"
 atd__min_diplomat_gain_desc: "Gain mensuel minimum de diplomates à maintenir. Les actions autonomes cesseront d'envoyer des diplomates si votre gain mensuel descend en dessous de cette valeur."
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "Catégorie"
 atd__improve_relations_i1_name: "Dirigeants des cercles impériaux"
 atd__improve_relations_i2_name: "Électeurs du Saint-Empire"
 atd__improve_relations_i3_name: "Membres du Saint-Empire"
 atd__improve_relations_i4_name: "Pays voisins"
 atd__improve_relations_i5_name: "Pays sujets"
 atd__improve_relations__count_name: "Diplomates"


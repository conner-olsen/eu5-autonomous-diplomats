 atd__improve_relations__improve_relations_desc: "Envoyez automatiquement des diplomates pour améliorer les relations avec les pays de chaque catégorie. Les catégories situées en haut de la liste sont prioritaires."
 atd__improve_relations_i1_desc: "Améliorer les relations avec les dirigeants des Cercles impériaux du Saint-Empire romain germanique."

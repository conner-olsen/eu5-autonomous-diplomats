 atd__improve_relations_i6_name: "Pays outragés"
 atd__improve_relations_i6_desc: "Améliorer les relations avec les pays ayant une opinion négative de vous, en ciblant les plus outragés en priorité."
 atd__improve_relations_i7_name: "Alliés"
 atd__improve_relations_i7_desc: "Améliorez les relations avec vos alliés et les membres de votre ligue défensive."

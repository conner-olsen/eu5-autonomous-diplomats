 # Mod
 atd_name: "Diplomates autonomes"
 atd_desc: "Automatisez vos actions diplomatiques."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "Réserve minimale de diplomates"
 atd__min_diplomats_desc: "Nombre minimal de diplomates en réserve à conserver. Les actions autonomes n'utiliseront pas de diplomates en dessous de ce seuil. Partagé avec le curseur du nombre minimal de diplomates mensuels sur la carte d'automatisation des interactions diplomatiques."
 atd__min_diplomat_gain_name: "Gain minimum de diplomates"
 atd__min_diplomat_gain_desc: "Gain mensuel minimum de diplomates à maintenir. Les actions autonomes cesseront d'envoyer des diplomates si votre gain mensuel descend en dessous de cette valeur."

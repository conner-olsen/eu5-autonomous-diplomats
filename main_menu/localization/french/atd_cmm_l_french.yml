l_french:
 # Mod
 atd_name: "Diplomates autonomes"
 atd_desc: "Automatisez vos actions diplomatiques."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "Réserve minimale de diplomates"
 atd__min_diplomats_desc: "Nombre minimal de diplomates en réserve à conserver. Les actions autonomes n'utiliseront pas de diplomates en dessous de ce seuil. Partagé avec le curseur du nombre minimal de diplomates mensuels sur la carte d'automatisation des interactions diplomatiques."
 atd__min_diplomat_gain_name: "Gain minimum de diplomates"
 atd__min_diplomat_gain_desc: "Gain mensuel minimum de diplomates à maintenir. Les actions autonomes cesseront d'envoyer des diplomates si votre gain mensuel descend en dessous de cette valeur."
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "Catégorie"
 atd__improve_relations_i1_name: "Dirigeants des cercles impériaux"
 atd__improve_relations_i2_name: "Électeurs du Saint-Empire"
 atd__improve_relations_i3_name: "Membres du Saint-Empire"
 atd__improve_relations_i4_name: "Pays voisins"
 atd__improve_relations_i5_name: "Pays sujets"
 atd__improve_relations__count_name: "Diplomates"

 # Optional: self-referencing flag keys to suppress IDE warnings (safe to remove if you want)
 atd: "atd"
 atd__min_diplomats: "atd__min_diplomats"
 atd__min_diplomat_gain: "atd__min_diplomat_gain"
 atd__improve_relations: "atd__improve_relations"
 atd__improve_relations__count: "atd__improve_relations__count"
 atd__improve_relations_name: "Améliorer les relations"
 atd__improve_relations__improve_relations_name: "Améliorer les relations"
 atd__improve_relations__improve_relations_desc: "Envoyez automatiquement des diplomates pour améliorer les relations avec les pays de chaque catégorie. Les catégories situées en haut de la liste sont prioritaires."
 atd__improve_relations_i1_desc: "Améliorer les relations avec les dirigeants des Cercles impériaux du Saint-Empire romain germanique."
 atd__improve_relations_i2_desc: "Améliorer les relations avec les électeurs du Saint-Empire romain germanique."
 atd__improve_relations_i3_desc: "Améliorer les relations avec les membres du Saint-Empire."
 atd__improve_relations_i4_desc: "Améliorer les relations avec les pays frontaliers."
 atd__improve_relations_i5_desc: "Améliorer les relations avec vos pays sujets."
 atd__improve_relations_i6_name: "Pays outragés"
 atd__improve_relations_i6_desc: "Améliore les relations avec les pays ayant au moins 10 d'antagonisme envers vous, en ciblant les plus outragés en priorité. Annule l'amélioration dès que leur antagonisme tombe en dessous de 5."
 atd__improve_relations_i7_name: "Alliés"
 atd__improve_relations_i7_desc: "Améliorez les relations avec vos alliés et les membres de votre ligue défensive."
 atd__subjects_name: "Sujets"
 atd__subjects__enforce_name: "Imposer"
 atd__enforce_item_column_name: "Action"
 atd__enforce_i1_name: "Imposer la religion"
 atd__enforce_i2_name: "Imposer la culture"
 atd__enforce__enabled_name: "Activé"
 atd__settings_name: "Paramètres"
 atd__settings__reserve_name: "Réserve"
 atd__settings__reserve_desc: "Paramètres de réserve des diplomates."
 atd__improve_relations__improve_relations: "atd__improve_relations__improve_relations"
 atd__subjects: "atd__subjects"
 atd__subjects__enforce: "atd__subjects__enforce"
 atd__enforce: "atd__enforce"
 atd__enforce__enabled: "atd__enforce__enabled"
 atd__settings: "atd__settings"
 atd__settings__reserve: "atd__settings__reserve"
 atd__improve_relations__automation_name: "Automatisation"
 atd__improve_relations_enabled_name: "Améliorer les relations"
 atd__improve_relations_enabled_desc: "Envoyez des diplomates pour améliorer les relations avec les pays des catégories ci-dessous."
 atd__settings__automation_name: "Automatisation"
 atd__enabled_name: "Activé"
 atd__enabled_desc: "Active les diplomates autonomes. Active ou désactive également l'automatisation des interactions diplomatiques."
 atd__min_diplomats_format: "[CMMV('atd__min_diplomats')|1]"
 atd_automation_open_settings: "Ouvrir les diplomates autonomes"
 atd_automation_improve_opinion_tooltip: "Envoyez des diplomates pour améliorer les relations avec les pays des catégories configurées. Configurez les catégories et les priorités dans les paramètres des diplomates autonomes."
 atd_automation_diplomat_reserve_tooltip: "L'automatisation n'enverra [diplomats|e] que lorsque le montant actuellement en réserve dépasse ce seuil, laissant le reste disponible pour votre utilisation manuelle. Cette réserve s'applique également aux diplomates autonomes et peut également être modifiée dans ses paramètres."
 atd__enabled: "atd__enabled"
 atd__improve_relations_enabled: "atd__improve_relations_enabled"
 atd__improve_relations__automation: "atd__improve_relations__automation"
 atd__settings__automation: "atd__settings__automation"
 atd__improve_relations_i8_name: "Pays menaçants"
 atd__improve_relations_i8_desc: "Améliorez les relations avec les pays qui vous menacent, en ciblant d'abord les menaces les plus importantes."
 atd__improve_relations_i9_name: "Propriétaires des marchés"
 atd__improve_relations_i9_desc: "Améliorer les relations avec les pays possédant un marché."
 atd__improve_relations_i10_name: "Royaumes et empires"
 atd__improve_relations_i10_desc: "Améliorer les relations avec les royaumes et les empires."
 atd__improve_relations_i11_name: "Plus grandes nations"
 atd__improve_relations_i11_desc: "Améliorez les relations avec les plus grandes nations à votre portée diplomatique que vous avez découvertes, en commençant par les plus puissantes."
 atd__improve_relations__limits_name: "Limites"
 atd__max_relations_name: "Relations maximales"
 atd__max_relations_desc: "Cesse d'améliorer les relations avec les pays une fois que leur opinion de vous atteint cette valeur, annulant toute amélioration en cours. À 200+, il n'y a pas de limite."
 atd__max_relations_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_relations'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_relations'))))]"
 atd__max_antagonism_name: "Antagonisme maximum"
 atd__max_antagonism_desc: "Ne pas améliorer les relations avec les pays dont l'antagonisme envers vous est supérieur à cette valeur. À 200+, il n'y a pas de limite."
 atd__max_antagonism_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_antagonism'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_antagonism'))))]"
 atd_block_autonomous_improving: "#B #!Bloquer l'amélioration autonome"
 atd_block_autonomous_improving_desc: "Cesser d'améliorer automatiquement les relations avec [SCOPE.sCountry('recipient').GetName]. Toute amélioration déjà en cours se terminera d'elle-même."
 atd_allow_autonomous_improving: "#B #!Autoriser l'amélioration autonome"
 atd_allow_autonomous_improving_desc: "Reprendre l'amélioration automatique des relations avec [SCOPE.sCountry('recipient').GetName]."

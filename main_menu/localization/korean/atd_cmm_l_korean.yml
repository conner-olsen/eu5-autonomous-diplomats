 atd__improve_relations_name: "관계 개선"
 atd__improve_relations__improve_relations_name: "관계 개선"
 atd__improve_relations__improve_relations_desc: "각 범주의 국가들과 관계를 개선하기 위해 외교관을 자동으로 파견합니다. 목록의 상단에 있는 범주일수록 우선순위가 높습니다."
 atd__improve_relations_i1_desc: "국경을 접한 국가들과 관계 개선"
 atd__improve_relations_i2_desc: "종속국과의 관계 개선"
 atd__improve_relations_i3_desc: "자신에 대해 부정적인 의견을 가진 국가들과의 관계를 개선하며, 가장 분노한 국가를 우선적으로 대상으로 합니다."
 atd__improve_relations_i4_desc: "동맹국 및 방어 연맹 구성원과 관계를 개선합니다."
 atd__improve_relations_i5_desc: "자신을 위협하는 국가들과의 관계를 개선하며, 가장 위협적인 국가를 우선적으로 목표로 삼습니다."
 atd__improve_relations_i6_name: "신성 로마 제국 선제후"
 atd__improve_relations_i6_desc: "신성 로마 제국 선제후와의 관계 개선."
 atd__improve_relations_i7_name: "신성 로마 제국 구성국"
 atd__improve_relations_i7_desc: "신성 로마 제국 회원국들과의 관계 개선"

l_korean:
 # Mod
 atd_name: "자율 외교관"
 atd_desc: "외교 활동을 자동화합니다."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "최소 외교관 예비량"
 atd__min_diplomats_desc: "예비로 유지할 최소 비축 외교관 수입니다. 자율 행동 시 이 임계값 미만의 외교관은 사용하지 않습니다. 외교 상호작용 자동화 카드의 '최소 월간 외교관' 슬라이더와 설정을 공유합니다."
 atd__min_diplomat_gain_name: "최소 외교관 획득량"
 atd__min_diplomat_gain_desc: "유지할 최소 월간 외교관 획득량입니다. 월간 획득량이 이 수치 미만으로 떨어지면 자율 행동을 통한 외교관 파견이 중단됩니다."
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "분류"
 atd__improve_relations_i1_name: "신성 로마 제국 관구 지도자"
 atd__improve_relations_i2_name: "신성 로마 제국 선제후"
 atd__improve_relations_i3_name: "신성 로마 제국 구성원"
 atd__improve_relations_i4_name: "인접 국가"
 atd__improve_relations_i5_name: "종속국 보유"
 atd__improve_relations__count_name: "외교관"

 # Optional: self-referencing flag keys to suppress IDE warnings (safe to remove if you want)
 atd: "atd"
 atd__min_diplomats: "atd__min_diplomats"
 atd__min_diplomat_gain: "atd__min_diplomat_gain"
 atd__improve_relations: "atd__improve_relations"
 atd__improve_relations__count: "atd__improve_relations__count"
 atd__improve_relations_name: "관계 개선"
 atd__improve_relations__improve_relations_name: "관계 개선"
 atd__improve_relations__improve_relations_desc: "각 범주의 국가들과 관계를 개선하기 위해 외교관을 자동으로 파견합니다. 목록의 상단에 있는 범주일수록 우선순위가 높습니다."
 atd__improve_relations_i1_desc: "신성 로마 제국 내 제국 관구 수장들과의 관계를 개선합니다."
 atd__improve_relations_i2_desc: "신성 로마 제국 선제후들과의 관계를 개선하십시오."
 atd__improve_relations_i3_desc: "신성 로마 제국 회원국들과의 관계 개선."
 atd__improve_relations_i4_desc: "인접한 국가들과의 관계를 개선하십시오."
 atd__improve_relations_i5_desc: "종속국과의 관계를 개선하십시오."
 atd__improve_relations_i6_name: "분노한 국가들"
 atd__improve_relations_i6_desc: "자신에 대한 적대 수치가 10 이상인 국가들과 관계를 개선하며, 가장 분노한 국가를 우선적으로 목표로 삼습니다. 적대 수치가 5 미만으로 떨어지면 관계 개선을 중단합니다."
 atd__improve_relations_i7_name: "동맹국"
 atd__improve_relations_i7_desc: "동맹국 및 방어 동맹 일원들과의 관계를 개선하십시오."
 atd__subjects_name: "종속국"
 atd__subjects__enforce_name: "강요"
 atd__enforce_item_column_name: "행동"
 atd__enforce_i1_name: "종교 강요"
 atd__enforce_i2_name: "문화 강요"
 atd__enforce__enabled_name: "활성화됨"
 atd__settings_name: "설정"
 atd__settings__reserve_name: "예비"
 atd__settings__reserve_desc: "외교관 예비 설정."
 atd__improve_relations__improve_relations: "atd__improve_relations__improve_relations"
 atd__subjects: "atd__subjects"
 atd__subjects__enforce: "atd__subjects__enforce"
 atd__enforce: "atd__enforce"
 atd__enforce__enabled: "atd__enforce__enabled"
 atd__settings: "atd__settings"
 atd__settings__reserve: "atd__settings__reserve"
 atd__improve_relations__automation_name: "자동화"
 atd__improve_relations_enabled_name: "관계 개선"
 atd__improve_relations_enabled_desc: "아래 범주에 속한 국가들과의 관계를 개선하기 위해 외교관을 파견합니다."
 atd__settings__automation_name: "자동화"
 atd__enabled_name: "활성화됨"
 atd__enabled_desc: "자율 외교관을 활성화합니다. 게임의 외교 상호작용 자동화 여부도 전환합니다."
 atd__min_diplomats_format: "[CMMV('atd__min_diplomats')|1]"
 atd_automation_open_settings: "자율 외교관 열기"
 atd_automation_improve_opinion_tooltip: "설정된 범주의 국가들과 관계를 개선하기 위해 외교관을 파견합니다. 자율 외교관 설정에서 범주와 우선순위를 설정하십시오."
 atd_automation_diplomat_reserve_tooltip: "자동화 기능은 현재 비축량이 이 보존량을 초과할 때만 [diplomats|e]을(를) 보내며, 남은 잔액은 플레이어가 수동으로 사용할 수 있도록 유지합니다. 이 보존량은 자율 외교관에게도 적용되며, 해당 설정에서 변경할 수 있습니다."
 atd__enabled: "atd__enabled"
 atd__improve_relations_enabled: "atd__improve_relations_enabled"
 atd__improve_relations__automation: "atd__improve_relations__automation"
 atd__settings__automation: "atd__settings__automation"
 atd__improve_relations_i8_name: "위협적인 국가들"
 atd__improve_relations_i8_desc: "자신을 위협하는 국가들과의 관계를 개선합니다. 가장 큰 위협을 우선적으로 공략합니다."
 atd__improve_relations_i9_name: "시장 소유주"
 atd__improve_relations_i9_desc: "시장을 보유한 국가들과 관계 개선"
 atd__improve_relations_i10_name: "왕국과 제국"
 atd__improve_relations_i10_desc: "왕국 및 제국들과의 관계를 개선합니다."
 atd__improve_relations_i11_name: "최대 국가들"
 atd__improve_relations_i11_desc: "발견한 외교 범위 내의 국가 중 규모가 가장 큰 국가부터 관계를 개선합니다."
 atd__improve_relations__limits_name: "제한"
 atd__max_relations_name: "최대 관계 수"
 atd__max_relations_desc: "국가의 관계도가 이 수치에 도달하면 관계 개선을 중단하며 진행 중인 관계 개선을 취소합니다. 200 이상이면 제한이 없습니다."
 atd__max_relations_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_relations'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_relations'))))]"
 atd__max_antagonism_name: "최대 적대감"
 atd__max_antagonism_desc: "이 수치보다 적대감이 높은 국가와는 관계를 개선하지 않습니다. 200 이상일 때는 제한이 없습니다."
 atd__max_antagonism_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_antagonism'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_antagonism'))))]"
 atd_block_autonomous_improving: "#B #!자율 개선 차단"
 atd_block_autonomous_improving_desc: "[SCOPE.sCountry('recipient').GetName]와(과)의 관계 자동 개선을 중단합니다. 이미 진행 중인 관계 개선은 그대로 완료됩니다."
 atd_allow_autonomous_improving: "#B #!자율적 개선 허용"
 atd_allow_autonomous_improving_desc: "[SCOPE.sCountry('recipient').GetName]와(과)의 자동 관계 개선을 재개합니다."

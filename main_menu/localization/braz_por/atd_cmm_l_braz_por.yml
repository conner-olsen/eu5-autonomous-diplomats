 atd__improve_relations__limits_name: "Limites"
 atd__max_relations_name: "Máximo de Relações"
 atd__max_relations_desc: "Pare de melhorar relações com os países assim que a opinião deles sobre você atingir este valor, cancelando qualquer melhoria em andamento. Em 200+, não há limite."
 atd__max_relations_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_relations'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_relations'))))]"
 atd__max_antagonism_name: "Antagonismo Máximo"
 atd__max_antagonism_desc: "Não melhore relações com países que tenham mais antagonismo em relação a você do que isto. Em 200+, não há limite."
 atd__max_antagonism_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_antagonism'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_antagonism'))))]"

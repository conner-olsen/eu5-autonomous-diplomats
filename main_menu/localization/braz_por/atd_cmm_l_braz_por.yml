 atd__improve_relations__improve_relations_name: "Melhorar Relações"
 atd__improve_relations__improve_relations_desc: "Envie diplomatas automaticamente para melhorar relações com países em cada categoria. As categorias no topo da lista têm prioridade."
 atd__improve_relations_i1_desc: "Melhorar as relações com os líderes dos Círculos Imperiais no Sacro Império Romano."
 atd__improve_relations_i2_desc: "Melhorar relações com os eleitores do Sacro Império Romano."
 atd__improve_relations_i3_desc: "Melhorar as relações com membros do Sacro Império Romano."
 atd__improve_relations_i4_desc: "Melhorar relações com países que fazem fronteira com você."
 atd__improve_relations_i5_desc: "Melhore as relações com seus países súditos."
 atd__improve_relations_i6_name: "Países Indignados"
 atd__improve_relations_i6_desc: "Melhora as relações com países que possuem pelo menos 10 de antagonismo em relação a você, visando primeiro os mais ultrajados. Cancela a melhoria assim que o antagonismo cair abaixo de 5."
 atd__improve_relations_i7_name: "Aliados"
 atd__improve_relations_i7_desc: "Melhore as relações com seus aliados e membros da liga defensiva."

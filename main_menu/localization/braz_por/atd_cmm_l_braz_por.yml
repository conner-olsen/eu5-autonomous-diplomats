 atd_automation_diplomat_reserve_tooltip: "A automação enviará [diplomats|e] apenas quando a quantia acumulada atual exceder esta reserva, deixando o restante disponível para seu uso manual. Esta reserva também se aplica a Diplomatas Autônomos e também pode ser alterada em suas configurações."

l_braz_por:
 # Mod
 atd_name: "Diplomatas Autônomos"
 atd_desc: "Automatize suas ações diplomáticas."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "Reserva Mínima de Diplomatas"
 atd__min_diplomats_desc: "Número mínimo de diplomatas acumulados para manter na reserva. Ações autônomas não usarão diplomatas abaixo deste limite. Compartilhado com o controle deslizante de Mínimo de Diplomatas Mensais no cartão de automação de Interações Diplomáticas."
 atd__min_diplomat_gain_name: "Ganho Mínimo de Diplomata"
 atd__min_diplomat_gain_desc: "Ganho mensal mínimo de diplomatas para manter. As ações autônomas deixarão de enviar diplomatas se o seu ganho mensal ficar abaixo deste valor."
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "Categoria"

 atd__min_gold_name: "最小ゴールド"
 atd__min_gold_desc: "国庫に少なくともこれだけの資金を維持します。支払うことで国庫がこの額を下回る場合、自動インタラクションはスキップされます。"
 CATEGORY_ATD_ACTIONS: "@CATEGORY_ATD_ACTIONS! 自律外交官"
 atd_start_auto_gifting: "#D #!自動贈呈を開始"
 atd_start_auto_gifting_act: "[SCOPE.sCountry('recipient').GetName]への自動送金を開始"
 atd_start_auto_gifting_desc: "10年のクールダウンが終了するたびに、[SCOPE.sCountry('recipient').GetName]に可能な限り多額の贈り物を自動的に送り、信頼度と評価を獲得します。待機リストにある国の管理と優先順位付けは、自律外交官の設定で行います。"
 atd_start_auto_gifting_effect_text: "[SCOPE.sCountry('recipient').GetName]への贈り物の自動送付を開始する"
 atd_start_auto_gifting_effect_text_past: "[SCOPE.sCountry('recipient').GetName]への贈り物の自動送付を開始しました。"

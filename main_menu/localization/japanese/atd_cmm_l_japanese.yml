 atd__interactions__auto_interactions_name: "自動インタラクション"
 atd__interactions__auto_interactions_desc: "リストの上から順に、毎月自動的に実行される相互作用。"
 atd__auto_interactions_item_column_name: "インタラクション"
 atd__auto_interactions__paused_name: "一時停止"
 atd__auto_interactions__paused_desc: "キューから削除せずに、この項目を一時停止します。"
 atd__auto_interactions__cancel_name: "キャンセル"

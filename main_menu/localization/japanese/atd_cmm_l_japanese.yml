l_japanese:
 # Mod
 atd_name: "自律外交官"
 atd_desc: "外交アクションを自動化します。"

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "予備外交官の最小数"
 atd__min_diplomats_desc: "予備として残しておく待機外交官の最小数。自律アクションは、この閾値を下回る外交官を使用しません。"
 atd__min_diplomat_gain_name: "最小外交官獲得"
 atd__min_diplomat_gain_desc: "維持すべき最小の月間外交官増加量。月間の増加量がこの値を下回る場合、自動アクションによる外交官の派遣は停止されます。"
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "カテゴリ"
 atd__improve_relations_i1_name: "隣接国"
 atd__improve_relations_i2_name: "自国の従属国"
 atd__improve_relations_i3_name: "憤慨した諸国"
 atd__improve_relations_i4_name: "同盟国"
 atd__improve_relations_i5_name: "脅威となる諸国"
 atd__improve_relations__count_name: "外交官"


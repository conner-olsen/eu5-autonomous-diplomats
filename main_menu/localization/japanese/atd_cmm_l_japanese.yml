 atd__improve_relations_name: "関係の改善"
 atd__improve_relations__improve_relations_name: "関係の改善"
 atd__improve_relations__improve_relations_desc: "各カテゴリの諸国との関係改善に外交官を自動的に派遣します。リストの上位にあるカテゴリが優先されます。"
 atd__improve_relations_i1_desc: "隣接する諸国との関係改善"
 atd__improve_relations_i2_desc: "従属国との関係を改善します。"
 atd__improve_relations_i3_desc: "自国に対して否定的な意見を持つ国との関係を改善します。最も激怒している国を優先的に対象とします。"
 atd__improve_relations_i4_desc: "同盟国および防衛同盟加盟国との関係を改善します。"
 atd__improve_relations_i5_desc: "自国を脅かしている国々との関係を改善します。最大の脅威を優先的に対象とします。"
 atd__improve_relations_i6_name: "神聖ローマ帝国の選帝侯"

l_japanese:
 # Mod
 atd_name: "自律外交官"
 atd_desc: "外交アクションを自動化します。"

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "予備外交官の最小数"
 atd__min_diplomats_desc: "予備として保持する外交官の最小数です。自律アクションは、この閾値を下回る外交官を使用しません。「外交アクション」自動化カードにある「最小月次外交官」スライダーと共有されます。"
 atd__min_diplomat_gain_name: "最小外交官獲得"
 atd__min_diplomat_gain_desc: "維持すべき最小の月間外交官増加量。月間の増加量がこの値を下回る場合、自動アクションによる外交官の派遣は停止されます。"
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "カテゴリ"
 atd__improve_relations_i1_name: "神聖ローマ帝国管区指導者"
 atd__improve_relations_i2_name: "神聖ローマ帝国選帝侯"
 atd__improve_relations_i3_name: "神聖ローマ帝国の加盟国"
 atd__improve_relations_i4_name: "隣接国"
 atd__improve_relations_i5_name: "所有する従属国"
 atd__improve_relations__count_name: "外交官"

 # Optional: self-referencing flag keys to suppress IDE warnings (safe to remove if you want)
 atd: "atd"
 atd__min_diplomats: "atd__min_diplomats"
 atd__min_diplomat_gain: "atd__min_diplomat_gain"
 atd__improve_relations: "atd__improve_relations"
 atd__improve_relations__count: "atd__improve_relations__count"
 atd__improve_relations_name: "関係の改善"
 atd__improve_relations__improve_relations_name: "関係の改善"
 atd__improve_relations__improve_relations_desc: "各カテゴリの諸国との関係改善に外交官を自動的に派遣します。リストの上位にあるカテゴリが優先されます。"
 atd__improve_relations_i1_desc: "神聖ローマ帝国の帝国管区の指導者たちとの関係を改善する。"
 atd__improve_relations_i2_desc: "神聖ローマ帝国の選帝侯との関係を改善する。"
 atd__improve_relations_i3_desc: "神聖ローマ帝国諸侯との関係を改善する。"
 atd__improve_relations_i4_desc: "隣接する諸国との関係を改善する。"
 atd__improve_relations_i5_desc: "従属国との関係を改善しましょう。"
 atd__improve_relations_i6_name: "憤慨している国々"
 atd__improve_relations_i6_desc: "自国に対して否定的な評価を持つ国との関係を改善します。最も憤慨している国を優先的に対象とします。"
 atd__improve_relations_i7_name: "同盟国"
 atd__improve_relations_i7_desc: "同盟国や防衛同盟の加盟国との関係を改善しましょう。"
 atd__subjects_name: "従属国"
 atd__subjects__enforce_name: "強制"
 atd__enforce_item_column_name: "行動"
 atd__enforce_i1_name: "宗教の強制"
 atd__enforce_i2_name: "文化の強制"
 atd__enforce__enabled_name: "有効"
 atd__settings_name: "設定"
 atd__settings__reserve_name: "予備"
 atd__settings__reserve_desc: "外交官の予備設定。"
 atd__improve_relations__improve_relations: "atd__improve_relations__improve_relations"
 atd__subjects: "atd__subjects"
 atd__subjects__enforce: "atd__subjects__enforce"
 atd__enforce: "atd__enforce"
 atd__enforce__enabled: "atd__enforce__enabled"
 atd__settings: "atd__settings"
 atd__settings__reserve: "atd__settings__reserve"
 atd__improve_relations__automation_name: "自動化"
 atd__improve_relations_enabled_name: "関係の改善"
 atd__improve_relations_enabled_desc: "以下のカテゴリーに属する国々との関係を改善するため、外交官を派遣します。"
 atd__settings__automation_name: "自動化"
 atd__enabled_name: "有効"
 atd__enabled_desc: "自律外交官を有効にします。ゲームの外交アクションの自動化設定も切り替わります。"
 atd__min_diplomats_format: "[CMMV('atd__min_diplomats')|1]"
 atd_automation_open_settings: "自律外交官を開く"
 atd_automation_improve_opinion_tooltip: "設定されたカテゴリー内の諸国との関係を改善するために外交官を派遣します。カテゴリーと優先順位は「自律的外交官」の設定で設定してください。"
 atd_automation_diplomat_reserve_tooltip: "自動化設定は、現在の蓄積量がこの確保分を超えている場合にのみ[diplomats|e]を送り、残りの分は手動で利用できるように残されます。この確保分は自律外交官にも適用され、その設定から変更することも可能です。"
 atd__enabled: "atd__enabled"
 atd__improve_relations_enabled: "atd__improve_relations_enabled"
 atd__improve_relations__automation: "atd__improve_relations__automation"
 atd__settings__automation: "atd__settings__automation"
 atd__improve_relations_i8_name: "脅威となっている国々"
 atd__improve_relations_i8_desc: "自国を脅かす国々との関係を改善します。最大の脅威を優先的に対象とします。"
 atd__improve_relations_i9_name: "市場の所有者"
 atd__improve_relations_i9_desc: "市場を所有する国々との関係を改善する。"
 atd__improve_relations_i10_name: "王国と帝国"
 atd__improve_relations_i10_desc: "王国や帝国との関係を改善する。"
 atd__improve_relations_i11_name: "最大の国家"
 atd__improve_relations_i11_desc: "発見済みの外交距離内にある国家のうち、最大の国家から順に関係を改善します。"

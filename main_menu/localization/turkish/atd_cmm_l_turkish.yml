l_turkish:
 # Mod
 atd_name: "Otonom Diplomatlar"
 atd_desc: "Diplomatik eylemlerinizi otomatikleştirin."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "Minimum Diplomat Rezervi"
 atd__min_diplomats_desc: "Yedekte tutulacak minimum biriktirilmiş diplomat sayısı. Diplomasi Etkileşimleri otomasyon kartındaki Minimum Aylık Diplomat sürgüsü ile paylaşılır."
 atd__min_diplomat_gain_name: "Minimum Diplomat Artışı"
 atd__min_diplomat_gain_desc: "Aylık diplomat kazanımınız bu değerin altındayken ilişkileri geliştirme duraklatılır. Tebaalara dayatma veya otomatik hediye gönderme durumlarında geçerli değildir."
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "Kategori"
 atd__improve_relations_i1_name: "Kutsal Roma İmparatorluğu Çember Liderleri"
 atd__improve_relations_i2_name: "Kutsal Roma İmparatorluğu Elektörleri"

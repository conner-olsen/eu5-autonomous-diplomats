 # Mod
 atd_name: "Otonom Diplomatlar"
 atd_desc: "Diplomatik eylemlerinizi otomatikleştirin."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "Minimum Diplomat Rezervi"
 atd__min_diplomats_desc: "Rezervde tutulacak minimum biriktirilmiş diplomat sayısı. Otonom eylemler, bu eşiğin altındaki diplomatları kullanmayacaktır. Diplomasi Etkileşimleri otomasyon kartındaki Minimum Aylık Diplomat kaydırıcısı ile paylaşılır."
 atd__min_diplomat_gain_name: "Minimum Diplomat Artışı"
 atd__min_diplomat_gain_desc: "Sürdürülmesi gereken minimum aylık diplomat artışı. Aylık artışınız bu değerin altına düşerse, otonom eylemler diplomat göndermeyi durduracaktır."
 ## Improve Relations (improve_relations) Group

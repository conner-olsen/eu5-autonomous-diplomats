 atd__min_diplomats_name: "Minimum Diplomat Rezervi"
 atd__min_diplomats_desc: "Yedekte tutulacak minimum boş diplomat sayısı. Otonom eylemler bu eşiğin altındaki diplomatları kullanmayacaktır."
 atd__min_diplomat_gain_name: "Minimum Diplomat Artışı"
 atd__min_diplomat_gain_desc: "Sürdürülmesi gereken minimum aylık diplomat artışı. Aylık artışınız bu değerin altına düşerse, otonom eylemler diplomat göndermeyi durduracaktır."

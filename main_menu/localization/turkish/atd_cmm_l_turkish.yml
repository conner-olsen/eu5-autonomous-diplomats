 atd_automation_diplomat_reserve_tooltip: "Otomasyon, [diplomats|e] kaynağını yalnızca mevcut biriken miktar bu rezervi aştığında gönderir ve geri kalanını manuel kullanımınız için saklı tutar. Bu rezerv Otonom Diplomatlar için de geçerlidir ve ayarlarından değiştirilebilir."

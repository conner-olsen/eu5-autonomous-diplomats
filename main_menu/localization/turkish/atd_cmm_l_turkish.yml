 atd__improve_relations__improve_relations_desc: "Her kategorideki ülkelerle ilişkileri geliştirmek için diplomatları otomatik olarak gönder. Listenin üst sıralarında yer alan kategorilere öncelik verilir."
 atd__improve_relations_i1_desc: "Kutsal Roma İmparatorluğu'ndaki İmparatorluk Çemberi liderleri ile ilişkileri geliştir."
 atd__improve_relations_i2_desc: "Kutsal Roma İmparatorluğu elektörleri ile ilişkileri geliştir."
 atd__improve_relations_i3_desc: "Kutsal Roma İmparatorluğu üyeleriyle ilişkileri geliştir."
 atd__improve_relations_i4_desc: "Komşu ülkelerle ilişkileri geliştir."
 atd__improve_relations_i5_desc: "Bağımlı ülkelerinle ilişkilerini geliştir."
 atd__improve_relations_i6_name: "Öfkeli Ülkeler"
 atd__improve_relations_i6_desc: "Size karşı olumsuz görüşe sahip ülkelerle ilişkileri geliştirin, önceliği en öfkeli olanlara verin."
 atd__improve_relations_i7_name: "Müttefikler"
 atd__improve_relations_i7_desc: "Müttefiklerinle ve savunma birliği üyelerinle ilişkilerini geliştir."

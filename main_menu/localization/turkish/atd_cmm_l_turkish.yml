 atd__improve_relations__improve_relations_desc: "Her kategorideki ülkelerle ilişkileri geliştirmek için diplomatları otomatik olarak gönder. Listenin üst sıralarında yer alan kategorilere öncelik verilir."
 atd__improve_relations_i1_desc: "Sizinle sınırı olan ülkelerle ilişkileri geliştirin."
 atd__improve_relations_i2_desc: "Tabi ülkelerinizle ilişkileri geliştirin."
 atd__improve_relations_i3_desc: "Sizden olumsuz görüşe sahip ülkelerle ilişkileri geliştirir, öncelikle en öfkeli olanları hedef alır."
 atd__improve_relations_i4_desc: "Müttefiklerinizle ve savunma ligi üyelerinizle ilişkileri geliştirin."
 atd__improve_relations_i5_desc: "Sizi tehdit eden ülkelerle ilişkileri geliştirir, önce en büyük tehditleri hedef alır."
 atd__improve_relations_i6_name: "KRİ Elektörleri"
 atd__improve_relations_i6_desc: "Kutsal Roma İmparatorluğu seçmenleri ile ilişkileri geliştir."
 atd__improve_relations_i7_name: "Kutsal Roma Üyeleri"
 atd__improve_relations_i7_desc: "Kutsal Roma İmparatorluğu üyeleriyle ilişkileri geliştir."

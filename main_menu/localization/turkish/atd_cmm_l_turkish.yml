 atd__settings__automation_name: "Otomasyon"
 atd__enabled_name: "Etkin"
 atd__enabled_desc: "Otonom Diplomatları Etkinleştir. Aynı zamanda oyunun Diplomasi Etkileşimleri otomasyonunu açıp kapatır."
 atd__min_diplomats_format: "[CMMV('atd__min_diplomats')|1]"
 atd_automation_open_settings: "Otonom Diplomatları Aç"
 atd_automation_improve_opinion_tooltip: "Yapılandırılmış kategorilerdeki ülkelerle ilişkileri geliştirmek için diplomat gönder. Kategorileri ve öncelikleri Otonom Diplomat ayarlarından yapılandır."
 atd_automation_diplomat_reserve_tooltip: "Otomasyon, sadece mevcut birikmiş miktar bu rezervi aştığında [diplomats|e] gönderecek ve geri kalanını manuel kullanımınız için hazır bırakacaktır. Bu rezerv Otonom Diplomatlar için de geçerlidir."
 atd__enabled: "atd__enabled"
 atd__improve_relations_enabled: "atd__improve_relations_enabled"
 atd__improve_relations__automation: "atd__improve_relations__automation"
 atd__settings__automation: "atd__settings__automation"
 atd__improve_relations_i8_name: "Tehditkâr Ülkeler"
 atd__improve_relations_i8_desc: "Seni tehdit eden ülkelerle ilişkileri geliştir, önce en büyük tehditleri hedefle."
 atd__improve_relations_i9_name: "Market Sahipleri"
 atd__improve_relations_i9_desc: "Pazar sahibi olan ülkelerle ilişkileri geliştir."
 atd__improve_relations_i10_name: "Krallıklar ve İmparatorluklar"
 atd__improve_relations_i10_desc: "Krallıklar ve imparatorluklar ile ilişkileri geliştir."
 atd__improve_relations_i11_name: "En Büyük Uluslar"
 atd__improve_relations_i11_desc: "Diplomatik menzilindeki keşfettiğin en büyük ülkelerle, en büyüğünden başlayarak ilişkileri geliştir."
 atd__improve_relations__limits_name: "Limitler"
 atd__max_relations_name: "Maksimum İlişki"
 atd__max_relations_desc: "Ülkelerin size olan görüşü bu değere ulaştığında, devam eden geliştirmeleri iptal ederek ilişki geliştirmeyi durdurur. 200+ değerinde sınır yoktur."
 atd__max_relations_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_relations'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_relations'))))]"
 atd__max_antagonism_name: "Maksimum Antagonizma"
 atd__max_antagonism_desc: "Size karşı bundan daha fazla husumeti olan ülkelerle ilişkileri geliştirme. 200+ değerinde sınır yoktur."
 atd__max_antagonism_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_antagonism'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_antagonism'))))]"
 atd_block_autonomous_improving: "#B #!Otomatik Geliştirmeyi Engelle"
 atd_block_autonomous_improving_desc: "[SCOPE.sCountry('recipient').GetName] ile ilişkileri otomatik olarak iyileştirmeyi durdur. Halihazırda devam eden iyileştirmeler kendiliğinden tamamlanacaktır."
 atd_allow_autonomous_improving: "#B #!Otomatik Geliştirmeye İzin Ver"
 atd_allow_autonomous_improving_desc: "[SCOPE.sCountry('recipient').GetName] ile otomatik olarak ilişkileri geliştirmeye devam et."

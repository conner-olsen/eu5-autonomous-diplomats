 atd_automation_diplomat_reserve_tooltip: "Автоматизация будет отправлять [diplomats|e] только в том случае, если текущий запас превышает этот резерв, оставляя остаток доступным для вашего ручного использования. Этот резерв также распространяется на автономных дипломатов, и его также можно изменить в их настройках."

 atd__improve_relations_name: "Улучшение отношений"
 atd__improve_relations__improve_relations_name: "Улучшить отношения"
 atd__improve_relations__improve_relations_desc: "Автоматически отправлять дипломатов для улучшения отношений со странами в каждой категории. Категории, расположенные выше в списке, имеют приоритет."
 atd__improve_relations_i1_desc: "Улучшать отношения с граничащими с вами странами."
 atd__improve_relations_i2_desc: "Улучшать отношения с вашими зависимыми странами."
 atd__improve_relations_i3_desc: "Улучшать отношения со странами, имеющими отрицательное мнение о вас, в первую очередь выбирая наиболее возмущенные."
 atd__improve_relations_i4_desc: "Улучшать отношения с вашими союзниками и членами оборонительной лиги."
 atd__improve_relations_i5_desc: "Улучшать отношения с угрожающими вам странами, начиная с наиболее опасных."
 atd__improve_relations_i6_name: "Курфюрсты СРИ"
 atd__improve_relations_i6_desc: "Улучшать отношения с курфюрстами Священной Римской империи."
 atd__improve_relations_i7_name: "Члены СРИ"
 atd__improve_relations_i7_desc: "Улучшать отношения с членами Священной Римской империи."

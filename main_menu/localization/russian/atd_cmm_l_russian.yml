l_russian:
 # Mod
 atd_name: "Автономные дипломаты"
 atd_desc: "Автоматизируйте свои дипломатические действия."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "Минимальный резерв дипломатов"
 atd__min_diplomats_desc: "Минимальное число дипломатов в запасе, которые необходимо сохранять. Автономные действия не будут использовать дипломатов, если их количество упадет ниже этого порога. Данное значение связано с ползунком «Минимальное количество ежемесячных дипломатов» на карточке автоматизации дипломатических взаимодействий."
 atd__min_diplomat_gain_name: "Минимальный прирост дипломатов"
 atd__min_diplomat_gain_desc: "Минимальный ежемесячный прирост дипломатов для поддержания. Автономные действия перестанут отправлять дипломатов, если ваш ежемесячный прирост упадет ниже этого значения."
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "Категория"
 atd__improve_relations_i1_name: "Соседние страны"
 atd__improve_relations_i2_name: "Собственные страны-субъекты"

l_simp_chinese:
 # Mod
 atd_name: "自动外交官"
 atd_desc: "自动化你的外交行动。"

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "最低外交官预留"
 atd__min_diplomats_desc: "预留的外交官积攒数量最小值。自动行动不会动用低于此阈值的外交官。此项与“外交互动”自动化卡片上的“每月最低外交官”滑块同步。"
 atd__min_diplomat_gain_name: "最低外交官增长"
 atd__min_diplomat_gain_desc: "维持所需的最低每月外交官增量。如果你的每月外交官增量低于此数值，自动行动将停止派遣外交官。"
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "类别"

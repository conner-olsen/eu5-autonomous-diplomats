 atd__improve_relations_i8_desc: "Popraw relacje z krajami, które ci zagrażają, koncentrując się najpierw na największych zagrożeniach."
 atd__improve_relations_i9_name: "Właściciele rynków"
 atd__improve_relations_i9_desc: "Popraw relacje z państwami posiadającymi rynek."
 atd__improve_relations_i10_name: "Królestwa i Cesarstwa"
 atd__improve_relations_i10_desc: "Popraw relacje z królestwami i cesarstwami."
 atd__improve_relations_i11_name: "Największe państwa"
 atd__improve_relations_i11_desc: "Poprawiaj relacje z największymi odkrytymi państwami w twoim zasięgu dyplomatycznym, zaczynając od największych."
 atd__improve_relations__limits_name: "Limity"
 atd__max_relations_name: "Maksymalna liczba relacji"
 atd__max_relations_desc: "Przestań poprawiać relacje z państwami, gdy ich opinia o tobie osiągnie tę wartość, przerywając wszelkie trwające działania. Przy 200+ nie ma limitu."
 atd__max_relations_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_relations'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_relations'))))]"
 atd__max_antagonism_name: "Maksymalny antagonizm"
 atd__max_antagonism_desc: "Nie poprawiaj relacji z państwami, których antagonizm wobec ciebie jest większy niż ta wartość. Przy 200+ nie ma limitu."
 atd__max_antagonism_format: "[Select_CString(GreaterThanOrEqualTo_CFixedPoint(CMMV('atd__max_antagonism'), '(CFixedPoint)200'), '200+', ToString_int32(FixedPointToInt(CMMV('atd__max_antagonism'))))]"

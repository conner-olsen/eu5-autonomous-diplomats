l_polish:
 # Mod
 atd_name: "Autonomiczni Dyplomaci"
 atd_desc: "Zautomatyzuj swoje działania dyplomatyczne."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "Minimalna rezerwa dyplomatów"
 atd__min_diplomats_desc: "Minimalna liczba zgromadzonych dyplomatów utrzymywanych w rezerwie. Współdzielona z suwakiem minimalnej miesięcznej liczby dyplomatów na karcie automatyzacji interakcji dyplomatycznych."
 atd__min_diplomat_gain_name: "Minimalny przyrost dyplomatów"
 atd__min_diplomat_gain_desc: "Minimalny miesięczny przyrost dyplomatów do utrzymania. Działania autonomiczne przestaną wysyłać dyplomatów, jeśli twój miesięczny przyrost spadnie poniżej tej wartości."
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "Kategoria"
 atd__improve_relations_i1_name: "Przywódcy Cyrkułów Cesarskich ŚCR"
 atd__improve_relations_i2_name: "Elektorzy Cesarstwa"
 atd__improve_relations_i3_name: "Członkowie ŚCR"
 atd__improve_relations_i4_name: "Sąsiednie kraje"
 atd__improve_relations_i5_name: "Własne kraje podległe"
 atd__improve_relations__count_name: "Dyplomaci"


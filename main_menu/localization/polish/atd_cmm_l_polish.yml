 atd_automation_open_settings: "Otwórz autonomicznych dyplomatów"
 atd_automation_improve_opinion_tooltip: "Wysyłaj dyplomatów, aby poprawiać relacje z państwami w skonfigurowanych kategoriach. Skonfiguruj kategorie i priorytety w ustawieniach autonomicznych dyplomatów."
 atd_automation_diplomat_reserve_tooltip: "Automatyzacja będzie wysyłać [diplomats|e] tylko wtedy, gdy aktualnie zgromadzona ilość przekroczy tę rezerwę, pozostawiając resztę do Twojego ręcznego użytku. Rezerwa ta ma zastosowanie również do autonomicznych dyplomatów i można ją zmienić także w ich ustawieniach."

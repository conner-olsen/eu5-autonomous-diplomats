 atd__min_diplomats_format: "[CMMV('atd__min_diplomats')|1]"
 atd_automation_open_settings: "Otwórz autonomicznych dyplomatów"
 atd_automation_improve_opinion_tooltip: "Wysyłaj dyplomatów, aby poprawiać relacje z państwami w skonfigurowanych kategoriach. Skonfiguruj kategorie i priorytety w ustawieniach autonomicznych dyplomatów."
 atd_automation_diplomat_reserve_tooltip: "Automatyzacja będzie wysyłać [diplomats|e] tylko wtedy, gdy aktualnie zgromadzona kwota przekroczy tę rezerwę, pozostawiając resztę do twojego ręcznego użytku. Rezerwa ta dotyczy również autonomicznych dyplomatów."

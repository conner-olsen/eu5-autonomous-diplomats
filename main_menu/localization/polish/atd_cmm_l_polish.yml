 atd__improve_relations__improve_relations_desc: "Automatycznie wysyłaj dyplomatów, aby poprawiać relacje z krajami w każdej kategorii. Kategorie znajdujące się wyżej na liście mają pierwszeństwo."
 atd__improve_relations_i1_desc: "Popraw relacje z przywódcami Cyrkułów Rzeszy w Świętym Cesarstwie Rzymskim."
 atd__improve_relations_i2_desc: "Popraw relacje z elektorami Świętego Cesarstwa Rzymskiego."
 atd__improve_relations_i3_desc: "Popraw relacje z członkami Świętego Cesarstwa Rzymskiego."
 atd__improve_relations_i4_desc: "Popraw relacje z państwami, które z Tobą graniczą."
 atd__improve_relations_i5_desc: "Popraw relacje ze swoimi krajami podległymi."
 atd__improve_relations_i6_name: "Oburzone państwa"
 atd__improve_relations_i6_desc: "Poprawia relacje z krajami, które mają co najmniej 10 antagonizmu wobec ciebie, biorąc na cel najpierw te najbardziej oburzone. Przerywa poprawę, gdy ich antagonizm spadnie poniżej 5."
 atd__improve_relations_i7_name: "Sojusznicy"
 atd__improve_relations_i7_desc: "Popraw relacje ze swoimi sojusznikami i członkami ligi obronnej."

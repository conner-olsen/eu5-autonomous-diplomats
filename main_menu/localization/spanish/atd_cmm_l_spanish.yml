l_spanish:
 # Mod
 atd_name: "Diplomáticos Autónomos"
 atd_desc: "Automatiza tus acciones diplomáticas."

 # General (general) Tab
 ## Reserve (reserve) Group
 atd__min_diplomats_name: "Reserva mínima de diplomáticos"
 atd__min_diplomats_desc: "Número mínimo de diplomáticos acumulados a mantener en reserva. Se comparte con el deslizador de Diplomáticos mensuales mínimos en la tarjeta de automatización de Interacciones diplomáticas."
 atd__min_diplomat_gain_name: "Ganancia mínima de diplomáticos"
 atd__min_diplomat_gain_desc: "Ganancia mensual mínima de diplomáticos a mantener. Las acciones autónomas dejarán de enviar diplomáticos si la ganancia mensual cae por debajo de este valor."
 ## Improve Relations (improve_relations) Group
 atd__improve_relations_item_column_name: "Categoría"

 atd__improve_relations_i6_desc: "Mejora las relaciones con los países que tengan al menos 25 de antagonismo hacia ti, priorizando primero a los más indignados. Cancela la mejora una vez que su antagonismo sea inferior a 5."
 atd__improve_relations_i7_name: "Aliados"
 atd__improve_relations_i7_desc: "Mejora las relaciones con tus aliados y con los miembros de la liga defensiva."
